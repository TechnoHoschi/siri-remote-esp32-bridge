<!doctype html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Die Seite bringt ihre Sprachen selbst mit; die Übersetzung des Browsers würde sie nur verfälschen. -->
<meta name="google" content="notranslate">
<title>Siri Bridge</title>
<script>
  // Vor dem ersten Zeichnen: gespeicherte Wahl für hell/dunkel anwenden (sonst folgt die Seite dem System).
  try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
  :root {
    color-scheme:light;
    --bg:#f3f3f0; --panel:#fff; --panel2:#f6f6f3; --text:#1b1b19; --muted:#6a6a64; --line:#deddd6;
    --accent:#1f6fd6; --on-accent:#fff; --accent-soft:#e3eefc; --ok:#2b8a3e; --wait:#b7791f; --bad:#c92a2a; --violet:#8a4fd8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme=light]) {
      color-scheme:dark;
      --bg:#141413; --panel:#1e1e1c; --panel2:#262623; --text:#ecece7; --muted:#9b9b93; --line:#343430;
      --accent:#6aa9ff; --on-accent:#0b1830; --accent-soft:#1d2b40; --ok:#69db7c; --wait:#f0b65a; --bad:#ff8787; --violet:#b592f0;
    }
  }
  :root[data-theme=dark] {
    color-scheme:dark;
    --bg:#141413; --panel:#1e1e1c; --panel2:#262623; --text:#ecece7; --muted:#9b9b93; --line:#343430;
    --accent:#6aa9ff; --on-accent:#0b1830; --accent-soft:#1d2b40; --ok:#69db7c; --wait:#f0b65a; --bad:#ff8787; --violet:#b592f0;
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:1080px; margin:0 auto; padding:22px 20px 60px; }
  h2 { font-size:15px; margin:0 0 12px; font-weight:650; }
  button, select, input { font:inherit; color:inherit; }
  button { padding:7px 14px; border-radius:8px; border:1px solid var(--line); background:var(--panel); cursor:pointer; }
  button:hover:not(:disabled) { border-color:var(--muted); }
  button.primary { background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:600; }
  button.danger { color:var(--bad); }
  button.armed { background:var(--bad); border-color:var(--bad); color:#fff; }
  button:disabled { opacity:.5; cursor:default; }
  select, input[type=text], input[type=password], input[type=number] { padding:7px 9px; border:1px solid var(--line); border-radius:8px; background:var(--bg); max-width:100%; }
  input[type=number] { width:96px; }
  input[type=file] { max-width:100%; }
  input[type=file]::file-selector-button { font:inherit; color:inherit; padding:7px 14px; margin-right:12px; border-radius:8px; border:1px solid var(--line); background:var(--panel); cursor:pointer; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

  /* Kopf: Zustand auf einen Blick */
  .hero { display:flex; flex-wrap:wrap; gap:14px 28px; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .state { display:flex; align-items:center; gap:16px; min-width:0; }
  .beacon { width:18px; height:18px; border-radius:50%; background:var(--muted); flex:none; box-shadow:0 0 0 6px color-mix(in srgb, currentColor 18%, transparent); color:var(--muted); }
  .beacon.ok { background:var(--ok); color:var(--ok); } .beacon.wait { background:var(--wait); color:var(--wait); } .beacon.bad { background:var(--bad); color:var(--bad); }
  .state h1 { font-size:26px; line-height:1.15; margin:0; font-weight:680; letter-spacing:-.01em; }
  .state p { margin:3px 0 0; color:var(--muted); }
  .brand { display:flex; align-items:center; gap:14px; text-align:right; color:var(--muted); font-size:13px; }
  .brand b { display:block; color:var(--text); font-size:15px; }
  #theme { width:36px; height:36px; padding:0; border-radius:50%; font-size:16px; line-height:1; }
  .langs { display:inline-flex; border:1px solid var(--line); border-radius:99px; overflow:hidden; }
  .langs button { border:0; border-radius:0; background:none; padding:6px 10px; font-size:12px; font-weight:600; color:var(--muted); line-height:1; }
  .langs button + button { border-left:1px solid var(--line); }
  .langs button[aria-pressed=true] { background:var(--accent); color:var(--on-accent); }

  .note { border:1px solid var(--accent); background:var(--accent-soft); border-radius:12px; padding:12px 16px; margin-bottom:16px; }
  .note b { display:block; margin-bottom:2px; }

  /* Reiter */
  .tabs { display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:18px; overflow-x:auto; }
  .tabs button { border:0; border-bottom:2px solid transparent; border-radius:0; background:none; padding:9px 14px; color:var(--muted); white-space:nowrap; }
  .tabs button[aria-selected=true] { color:var(--text); border-bottom-color:var(--accent); font-weight:600; }
  .tabs button.dirty::after { content:" ●"; color:var(--wait); font-size:11px; vertical-align:2px; }

  .cards { display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:16px; align-items:start; }
  .cards.wide { grid-template-columns:repeat(auto-fit, minmax(min(100%, 400px), 1fr)); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px 18px; }
  dl { display:grid; grid-template-columns:auto 1fr; gap:6px 16px; margin:0; }
  dt { color:var(--muted); } dd { margin:0; font-weight:600; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; text-align:right; }
  .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; align-items:center; }
  .hint { color:var(--muted); font-size:13px; margin:12px 0 0; }
  .field { display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; justify-content:space-between; padding:9px 0; border-top:1px solid var(--line); }
  .field:first-of-type { border-top:0; padding-top:0; }
  .field > span:first-child { min-width:150px; flex:1 1 150px; }
  .field small { display:block; color:var(--muted); font-size:12px; }
  label.check { display:inline-flex; gap:7px; align-items:center; }
  .savebar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:16px; }
  .savebar span { color:var(--muted); font-size:13px; }
  h3.group { font-size:13px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin:26px 0 10px; }
  h3.group:first-child { margin-top:4px; }

  /* LED-Legende */
  .legend { display:grid; grid-template-columns:auto 1fr; gap:9px 12px; align-items:center; margin:0; font-size:14px; }
  .lamp { width:13px; height:13px; border-radius:50%; background:var(--accent); }
  .lamp.fast { animation:blink .4s steps(1) infinite; } .lamp.flash { animation:flash 2s steps(1) infinite; }
  .lamp.slow { animation:blink 1s steps(1) infinite; background:var(--violet); } .lamp.yellow { background:#f0a000; animation:blink 1s steps(1) 3; } .lamp.white { background:#c9c9c9; animation:blink .12s steps(1) infinite; }
  @keyframes blink { 50% { opacity:.12; } } @keyframes flash { 0% { opacity:1; } 6%,100% { opacity:.12; } }

  /* Tasten: gezeichnete Remote + Editor. Maße nach der echten Siri Remote (Breite ≈ 26 % der Höhe). */
  .keys { display:grid; grid-template-columns:220px minmax(0, 1fr); gap:16px; align-items:start; }
  @media (max-width:720px) { .keys { grid-template-columns:1fr; } }
  .remote-wrap { padding:22px 0 18px; display:flex; flex-direction:column; align-items:center; }
  .remote-wrap .hint { margin:16px 14px 0; text-align:center; }
  .remote { position:relative; width:124px; height:470px; border-radius:26px; margin-right:22px;
            background:linear-gradient(180deg, #f6f6f7 0%, #e3e3e6 38%, #c3c3c8 78%, #b4b4b9 100%);
            box-shadow:inset 0 0 0 1px rgba(0,0,0,.10), inset 0 1px 0 #fff, 0 6px 18px rgba(0,0,0,.18); }
  .mic { position:absolute; top:23px; left:58px; width:8px; height:3px; border-radius:2px; background:#3a3a3c; }
  .rk { position:absolute; display:grid; place-items:center; padding:0; border:0; border-radius:50%; background:#1c1c1e; color:#f2f2f4;
        transition:background .25s ease-out, box-shadow .25s ease-out; }
  .rk:hover:not(:disabled) { background:#3a3a3d; }
  .rk svg { width:54%; height:54%; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .rk.sel { box-shadow:0 0 0 2px #e3e3e6, 0 0 0 5px var(--accent); }
  .rk.off { color:#8e8e93; }
  #tab-start .rk.sel { box-shadow:none; }
  .rk.hit { background:var(--accent) !important; color:#fff; box-shadow:0 0 0 5px color-mix(in srgb, var(--accent) 40%, transparent); transition:none; }
  .power { top:14px; left:88px; width:22px; height:22px; background:#ececef; color:#1c1c1e; box-shadow:inset 0 0 0 1px #8e8e93; }
  .power:hover:not(:disabled) { background:#fff; }
  .pad { position:absolute; top:47px; left:7px; width:110px; height:110px; border-radius:50%; background:#1c1c1e; }
  .click { top:23px; left:23px; width:64px; height:64px; background:#232325; box-shadow:inset 0 0 0 1px #3a3a3c; }
  .seg { width:28px; height:28px; background:transparent; }
  .seg::before { content:""; width:4px; height:4px; border-radius:50%; background:currentColor; }
  .seg:hover:not(:disabled) { background:#3a3a3d; }
  .seg.sel { box-shadow:0 0 0 2px var(--accent); }
  .up { top:-2px; left:41px; } .down { bottom:-2px; left:41px; } .left { left:-2px; top:41px; } .right { right:-2px; top:41px; }
  .back { top:160px; left:13px; width:44px; height:44px; } .home { top:160px; left:67px; width:44px; height:44px; }
  .play { top:212px; left:13px; width:44px; height:44px; } .mute { top:264px; left:13px; width:44px; height:44px; }
  .volup { top:212px; left:67px; width:44px; height:48px; border-radius:22px 22px 0 0; } .voldn { top:260px; left:67px; width:44px; height:48px; border-radius:0 0 22px 22px; }
  .volup svg, .voldn svg { width:44%; height:44%; }
  .siri { top:78px; right:-5px; width:6px; height:50px; border-radius:0 4px 4px 0; background:#c9c9ce; box-shadow:inset 0 0 0 1px rgba(0,0,0,.18); }
  .siri:hover:not(:disabled) { background:#fff; }
  .siri-label { position:absolute; top:94px; right:-38px; font-size:11px; color:var(--muted); pointer-events:none; }

  .profile { margin:-2px 0 16px; padding-bottom:12px; border-bottom:1px solid var(--line); }
  .profile select, .profile input { width:230px; }
  .editor h3 { margin:0; font-size:19px; } .editor .now { color:var(--muted); margin:2px 0 14px; }
  .segctl { display:inline-flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; }
  .segctl button { border:0; border-radius:0; background:none; padding:7px 15px; }
  .segctl button + button { border-left:1px solid var(--line); }
  .segctl button[aria-pressed=true] { background:var(--accent); color:var(--on-accent); font-weight:600; }
  .chips { display:flex; gap:6px; } .chips button { padding:5px 12px; border-radius:99px; }
  .chips button[aria-pressed=true] { background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }
  .edrow { display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; margin-top:14px; min-height:36px; }
  .edrow > span:first-child { min-width:92px; color:var(--muted); }
  .all { margin-top:18px; border-top:1px solid var(--line); padding-top:12px; display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:2px 18px; align-items:start; }
  .all > div { display:grid; gap:2px; }
  @media (max-width:900px) { .all { grid-template-columns:1fr; } }
  .all button { display:flex; justify-content:space-between; gap:10px; width:100%; border:0; background:none; padding:5px 8px; border-radius:6px; text-align:left; }
  .all button:hover { background:var(--panel2); } .all button.sel { background:var(--accent-soft); }
  .all span:first-child { white-space:nowrap; }
  .all span:last-child { color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .pw, .pick { display:inline-flex; gap:6px; align-items:center; max-width:100%; } .pw button, .pick button { padding:7px 10px; line-height:1; }
  .pick select { min-width:0; max-width:230px; } .pw input { width:230px; }
  progress { width:100%; height:8px; margin-top:10px; }
  .loaded { margin-top:10px; padding:8px 12px; border-radius:8px; background:var(--accent-soft); font-size:14px; overflow-wrap:anywhere; }
  .loaded.ok { background:color-mix(in srgb, var(--ok) 18%, transparent); } .loaded.err { background:color-mix(in srgb, var(--bad) 18%, transparent); }
  .reset { display:grid; grid-template-columns:1fr auto; gap:12px 16px; align-items:center; }
  .reset div b { display:block; } .reset div span { color:var(--muted); font-size:13px; }
  .reset > div:nth-child(n+3) { border-top:1px solid var(--line); padding-top:12px; }
  .reset > button:nth-child(n+3) { margin-top:12px; }
  .reset button { white-space:nowrap; }

  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:9px 16px; border-radius:99px; font-size:14px; z-index:6; max-width:calc(100% - 32px); }
  .toast.err { background:var(--bad); color:#fff; }
</style>
</head>
<body>
<main>
  <header class="hero">
    <div class="state">
      <div class="beacon" id="beacon"></div>
      <div><h1 id="title">&nbsp;</h1><p id="subtitle">&nbsp;</p></div>
    </div>
    <div class="brand">
      <div><b>Siri Bridge</b><span id="version">&nbsp;</span></div>
      <div class="langs" id="langs" role="group" data-i18n-title="lang.switch"></div>
      <button id="theme" data-i18n-title="theme.toggle"></button>
    </div>
  </header>

  <div class="note" id="apnote" hidden>
    <b data-i18n="apnote.title"></b>
    <span data-i18n-html="apnote.text"></span>
  </div>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="start" data-i18n="tab.start"></button>
    <button role="tab" data-tab="tasten" data-i18n="tab.keys"></button>
    <button role="tab" data-tab="einst" data-i18n="tab.settings"></button>
  </nav>

  <!-- Übersicht -->
  <section id="tab-start">
    <div class="keys">
      <div class="card remote-wrap">
        <div class="remote"></div>
        <p class="hint" data-i18n="live.hint"></p>
      </div>
      <div class="cards">
        <div class="card">
          <h2 data-i18n="remote.title"></h2>
          <dl>
            <dt data-i18n="remote.bond"></dt><dd id="bond">–</dd>
            <dt data-i18n="remote.link"></dt><dd id="link">–</dd>
            <dt data-i18n="remote.signal"></dt><dd id="rssi">–</dd>
            <dt data-i18n="remote.battery"></dt><dd id="batt">–</dd>
            <dt data-i18n="remote.profile"></dt><dd id="profile-view">–</dd>
            <dt data-i18n="remote.lastkey"></dt><dd id="key">–</dd>
            <dt data-i18n="remote.sends"></dt><dd id="keysends">–</dd>
          </dl>
          <div class="actions"><button class="danger" id="unpair" data-i18n="remote.unpair"></button></div>
          <p class="hint" data-i18n-html="remote.pairhint"></p>
        </div>
        <div class="card">
          <h2 data-i18n="dongle.title"></h2>
          <dl>
            <dt data-i18n="dongle.firmware"></dt><dd id="fwver">–</dd>
            <dt data-i18n="dongle.uptime"></dt><dd id="uptime">–</dd>
            <dt data-i18n="dongle.wifi"></dt><dd id="wifi">–</dd>
            <dt data-i18n="dongle.address"></dt><dd id="ip">–</dd>
            <dt data-i18n="dongle.left"></dt><dd id="left">–</dd>
          </dl>
          <div class="actions"><button id="setupoff" data-i18n="dongle.wifioff"></button><button id="reboot" data-i18n="dongle.reboot"></button></div>
          <p class="hint" id="dongle-hint"></p>
        </div>
        <div class="card" id="legend-box">
          <h2 data-i18n="led.legend"></h2>
          <div class="legend">
            <div class="lamp fast"></div><div data-i18n-html="led.fast"></div>
            <div class="lamp flash"></div><div data-i18n-html="led.flash"></div>
            <div class="lamp"></div><div id="led-solid"></div>
            <div class="lamp slow"></div><div id="led-slow"></div>
            <div class="lamp white"></div><div id="led-white"></div>
            <div class="lamp yellow"></div><div id="led-yellow"></div>
          </div>
          <p class="hint" data-i18n="led.boot"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- Tasten -->
  <section id="tab-tasten" hidden>
    <div class="keys">
      <div class="card remote-wrap"><div class="remote"></div></div>
      <div class="card editor">
        <div class="profile">
          <div class="field"><span><span data-i18n="profile.label"></span><small id="prof-note"></small></span><select id="profile"></select></div>
          <div class="field"><span data-i18n="profile.name"></span>
            <span class="pick"><input type="text" id="profname" maxlength="23" autocomplete="off"><button type="button" id="profreset" data-i18n="profile.reset"></button></span></div>
        </div>
        <h3 id="ed-name">&nbsp;</h3>
        <div class="now" id="ed-now">&nbsp;</div>
        <div id="ed-body" hidden>
          <div class="segctl" id="ed-type">
            <button type="button" data-t="0" data-i18n="ed.none"></button><button type="button" data-t="1" data-i18n="ed.keyboard"></button><button type="button" data-t="2" data-i18n="ed.media"></button>
          </div>
          <div class="edrow" id="ed-keyrow"><span data-i18n="ed.key"></span><select id="ed-key"></select></div>
          <div class="edrow" id="ed-modrow"><span data-i18n="ed.mods"></span>
            <div class="chips" id="ed-mods"><button type="button" data-m="1" data-i18n="mod.ctrl"></button><button type="button" data-m="2" data-i18n="mod.shift"></button><button type="button" data-m="4" data-i18n="mod.alt"></button></div></div>
          <div class="edrow" id="ed-consrow"><span data-i18n="ed.function"></span><select id="ed-cons"></select></div>
          <p class="hint" id="ed-ir" hidden data-i18n="ed.ir"></p>
        </div>
        <div class="all" id="all"></div>
        <div class="savebar" data-keys="active,profiles"><button class="primary save" data-i18n="save"></button><button class="discard" data-i18n="discard"></button><span class="dirtynote"></span></div>
        <p class="hint" data-i18n="profile.hint"></p>
        <p class="hint"><label class="check"><input type="checkbox" id="follow"> <span data-i18n="ed.follow"></span></label></p>
        <p class="hint" data-i18n="ed.hint"></p>
      </div>
    </div>
  </section>

  <!-- Einstellungen -->
  <section id="tab-einst" hidden>
    <h3 class="group" data-i18n="set.group.dongle"></h3>
    <div class="cards wide">
      <div class="card">
        <h2 data-i18n="set.led.title"></h2>
        <div class="field"><span data-i18n="set.led.type"></span>
          <select id="ledType"><option value="0" data-i18n="set.led.type.none"></option><option value="1" data-i18n="set.led.type.rgb"></option><option value="2" data-i18n="set.led.type.gpio"></option></select></div>
        <div class="field led-any"><span data-i18n="set.led.pin"></span><input type="number" id="ledPin" min="0" max="48"></div>
        <div class="field led-rgb"><span><span data-i18n="set.led.brightness"></span><small id="bri-val"></small></span><input type="range" id="ledBri" min="1" max="255"></div>
        <div class="field led-gpio"><span data-i18n="set.led.polarity"></span><label class="check"><input type="checkbox" id="ledInv"> <span data-i18n="set.led.inverted"></span></label></div>
        <div class="field led-any"><span data-i18n="set.led.running"></span><label class="check"><input type="checkbox" id="ledDark"> <span data-i18n="set.led.dark"></span></label></div>
        <div class="savebar" data-keys="ledType,ledPin,ledBri,ledInv,ledDark"><button class="primary save" data-i18n="save"></button><button class="discard" data-i18n="discard"></button><span class="dirtynote"></span></div>
        <p class="hint" data-i18n="set.led.hint"></p>
      </div>
      <div class="card">
        <h2 data-i18n="set.conn.title"></h2>
        <div class="field"><span><span data-i18n="set.conn.interval"></span><small data-i18n="set.conn.interval.sub"></small></span>
          <select id="itv"><option value="6" data-i18n="set.conn.interval.fast"></option><option value="9" data-i18n="set.conn.interval.mid"></option><option value="12" data-i18n="set.conn.interval.default"></option></select></div>
        <div class="field"><span><span data-i18n="set.conn.stale"></span><small data-i18n="set.conn.stale.sub"></small></span><input type="number" id="stale" min="0" max="5000" step="50"></div>
        <div class="savebar" data-keys="itv,stale"><button class="primary save" data-i18n="save"></button><button class="discard" data-i18n="discard"></button><span class="dirtynote"></span></div>
        <p class="hint" data-i18n="set.conn.hint"></p>
      </div>
    </div>
    <h3 class="group" data-i18n="set.group.wifi"></h3>
    <div class="cards wide">
      <div class="card">
        <h2 data-i18n="wifi.title"></h2>
        <form id="wifiform">
          <div class="field"><span><span data-i18n="wifi.network"></span><small id="msg-scan"></small></span>
            <span class="pick"><select id="netsel"></select><button type="button" id="scan" data-i18n-title="wifi.scan">↻</button></span></div>

<div class="toast" id="toast" hidden></div>

<script>
// ---- Sprache ------------------------------------------------------------------------------------
// Die Texte stehen je Sprache in web/lang/<kürzel>.json; firmware/build.sh (und tools/ui_dev.py) setzen sie
// hier ein. Eine weitere Sprache ist eine weitere Datei – der Umschalter im Kopf entsteht aus dieser Liste.
const LANGS = /*LANGS*/{};
const FALLBACK = 'en';
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
// Gewählt ist, was der Nutzer in diesem Browser eingestellt hat; sonst die erste passende Browsersprache, sonst Englisch.
let lang = store.get('lang', '');
if (!LANGS[lang]) lang = (navigator.languages || [navigator.language || '']).map(l => l.slice(0, 2).toLowerCase()).find(l => LANGS[l]) || FALLBACK;
// Text zu einem Schlüssel; {name} wird durch vars.name ersetzt. Fehlt er in der Sprache, gilt Englisch.
function t(key, vars) {
  let s = (LANGS[lang] || {})[key];
  if (s === undefined) s = (LANGS[FALLBACK] || {})[key];
  if (s === undefined) return key;
  return vars ? s.replace(/\{(\w+)\}/g, (m, k) => k in vars ? vars[k] : m) : s;
}

const KEYS = [[0x52,'@key.up'],[0x51,'@key.down'],[0x50,'@key.left'],[0x4F,'@key.right'],[0x28,'@key.enter'],[0x29,'@key.esc'],[0x2A,'@key.backspace'],
  [0x2B,'@key.tab'],[0x2C,'@key.space'],[0x4A,'@key.home'],[0x4D,'@key.end'],[0x4B,'@key.pgup'],[0x4E,'@key.pgdn'],[0x49,'@key.ins'],[0x4C,'@key.del'],[0x65,'@key.menu'],
  ...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map((c,i)=>[4+i,c]), ...'123456789'.split('').map((c,i)=>[0x1E+i,c]), [0x27,'0'],
  ...Array.from({length:12},(_,i)=>[0x3A+i,'F'+(i+1)]), [0x2D,'-'],[0x2E,'='],[0x2F,'['],[0x30,']'],[0x31,'\\'],[0x33,';'],[0x34,"'"],[0x35,'`'],[0x36,','],[0x37,'.'],[0x38,'/']];
const CONSUMER = [[0x41,'@media.ok'],[0xE9,'@media.volup'],[0xEA,'@media.voldown'],[0xE2,'@media.mute'],[0xCD,'@media.playpause'],[0xB0,'@media.play'],[0xB1,'@media.pause'],[0xB7,'@media.stop'],[0xB5,'@media.next'],
  [0xB6,'@media.prev'],[0xB3,'@media.ffwd'],[0xB4,'@media.rewind'],[0x223,'@media.home'],[0x224,'@media.back'],[0x221,'@media.search'],[0xCF,'@media.voice'],[0x40,'@media.menu'],[0x9C,'@media.chup'],
  [0x9D,'@media.chdown'],[0x8D,'@media.guide'],[0x30,'@media.power'],[0x32,'@media.standby']];
// Namen in den Listen oben: „@schlüssel“ wird übersetzt, alles andere (Buchstaben, Ziffern, F-Tasten) gilt wörtlich.
const keyName = n => n[0] === '@' ? t(n.slice(1)) : n;
const usage = (list, code) => { const k = list.find(k => k[0] === code); return k ? keyName(k[1]) : '?'; };
const btnName = n => t('btn.' + n) === 'btn.' + n ? n : t('btn.' + n);
// Die Liste aller Tasten in drei Spalten (Indizes wie im Button-Report): Clickpad, dann linke und rechte
// Tastenreihe der Remote von oben nach unten.
const LIST_COLUMNS = [[3, 9, 11, 12, 10], [4, 6, 8, 7], [5, 0, 1, 2]];
const MINUTES = [5, 10, 30, 60, 0];
const TABS = ['start','tasten','einst'];
const REMOTE = `<div class="mic"></div>
<button class="rk power" data-i="4"><svg viewBox="0 0 24 24"><path d="M12 4v8M7.5 7a7 7 0 1 0 9 0"/></svg></button>
<div class="pad">
<button class="rk seg up" data-i="9"></button><button class="rk seg right" data-i="10"></button>
<button class="rk seg down" data-i="11"></button><button class="rk seg left" data-i="12"></button>
<button class="rk click" data-i="3"></button>
</div>
<button class="rk back" data-i="6"><svg viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg></button>
<button class="rk home" data-i="0"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="10.5" rx="1.5"/><path d="M9.5 20h5"/></svg></button>
<button class="rk play" data-i="8"><svg viewBox="0 0 24 24"><path d="M4.5 6.5v11l8-5.5zM16 6.5v11M19.5 6.5v11"/></svg></button>
<button class="rk mute" data-i="7"><svg viewBox="0 0 24 24"><path d="M5.5 10v4h3l4 3.5v-11l-4 3.5zM4.5 4.5l15 15"/></svg></button>
<button class="rk volup" data-i="1"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<button class="rk voldn" data-i="2"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
<button class="rk siri" data-i="5"></button>
<div class="siri-label">Siri</div>`;
const OTHER = '\u0000other';
const $ = id => document.getElementById(id);
const all = sel => document.querySelectorAll(sel);
const dur = s => s >= 3600 ? Math.floor(s / 3600) + ' h ' + Math.floor(s % 3600 / 60) + ' min' : s >= 60 ? Math.floor(s / 60) + ' min ' + (s % 60) + ' s' : s + ' s';

let saved = null, draft = null, selected = 3, scannedOnce = false, toastTimer = 0, savedSsid = '', lastState = null, lastNets = [];

// ---- Hilfen -------------------------------------------------------------------------------------
function toast(text, err) {
  const el = $('toast'); el.textContent = text; el.className = 'toast' + (err ? ' err' : ''); el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.hidden = true, err ? 7000 : 3500);
}
// Fehlertexte des Dongles sind kurze Kennungen (z. B. „bad-ip“); gibt es dazu einen Text, wird er gezeigt.
const errText = err => t('error', {msg: t('err.' + err.message) === 'err.' + err.message ? err.message : t('err.' + err.message)});
async function post(url, body) { const r = await fetch(url, {method:'POST', body}); if (!r.ok) throw new Error(await r.text() || r.status); return r.text(); }
// Zweistufige Bestätigung im Knopf selbst statt eines Browser-Dialogs.
function confirmed(button, action) {
  let timer = 0;
  const reset = () => { clearTimeout(timer); button.classList.remove('armed'); button.textContent = t(button.dataset.i18n); };
  button.onclick = async () => {
    if (!button.classList.contains('armed')) {
      button.classList.add('armed'); button.textContent = t('confirm.again');
      timer = setTimeout(reset, 4000);
      return;
    }
    reset();
    try { await action(); } catch (err) { toast(errText(err), true); }
  };
}
const label = a => a.t === 1 ? [a.m & 1 ? t('mod.ctrl') : '', a.m & 2 ? t('mod.shift') : '', a.m & 4 ? t('mod.alt') : '', usage(KEYS, a.c)].filter(Boolean).join(' + ')
  : a.t === 2 ? usage(CONSUMER, a.c) : t('action.none');
const profName = (p, i) => p.name.trim() || t('profile.fallback', {n: i + 1});

// ---- Hell / Dunkel ------------------------------------------------------------------------------
function isDark() { const t = document.documentElement.dataset.theme; return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; }
function paintTheme() { $('theme').textContent = isDark() ? '☀' : '☾'; }
$('theme').onclick = () => { const next = isDark() ? 'light' : 'dark'; document.documentElement.dataset.theme = next; store.set('theme', next); paintTheme(); };
paintTheme();

// ---- Reiter -------------------------------------------------------------------------------------
function showTab(name) {
  if (name === 'netz' || name === 'geraet') name = 'einst';
  if (!TABS.includes(name)) name = 'start';
  for (const t of TABS) $('tab-' + t).hidden = t !== name;
  all('.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === name));
  if (location.hash.slice(1) !== name) history.replaceState(null, '', '#' + name);
}
all('.tabs button').forEach(b => b.onclick = () => showTab(b.dataset.tab));
window.onhashchange = () => showTab(location.hash.slice(1));

// ---- Einstellungen: Entwurf, Speichern ----------------------------------------------------------
const SETTINGS = ['ledType','ledPin','ledBri','ledInv','ledDark','itv','stale','mins','siri'];
const PROFILE_KEYS = ['active', 'profiles'];
const cur = () => draft.profiles[draft.active];
const dirty = () => differs(PROFILE_KEYS) || differs(SETTINGS);
const differs = keys => saved && keys.some(k => JSON.stringify(saved[k]) !== JSON.stringify(draft[k]));
function syncDirty() {
  document.querySelector('[data-tab=tasten]').classList.toggle('dirty', differs(PROFILE_KEYS));
  document.querySelector('[data-tab=einst]').classList.toggle('dirty', differs(SETTINGS));
  all('.savebar').forEach(bar => {
    const changed = differs(bar.dataset.keys.split(','));
    bar.querySelectorAll('button').forEach(b => b.disabled = !changed);
    bar.querySelector('.dirtynote').textContent = changed ? t('unsaved') : '';
  });
}
function loadConfig(c) { saved = c; draft = JSON.parse(JSON.stringify(c)); renderConfig(); }
function fillMinutes() {
  const list = MINUTES.includes(draft.mins) ? MINUTES : [draft.mins, ...MINUTES];
  $('mins').innerHTML = '';
  for (const m of list) $('mins').add(new Option(m ? t('reach.after', {n: m}) : t('reach.never'), m));
  $('mins').value = draft.mins;
}
function renderConfig() {
  renderProfile(); renderKeys(); renderEditor();
  $('ledType').value = draft.ledType; $('ledPin').value = draft.ledPin; $('ledBri').value = draft.ledBri; $('ledInv').checked = !!draft.ledInv; $('ledDark').checked = !!draft.ledDark;
  $('itv').value = draft.itv; $('stale').value = draft.stale; $('siri').checked = !!draft.siri;
  fillMinutes();
  syncLed(); syncDirty();
}
function syncLed() {
  const t = +$('ledType').value;
  all('.led-any').forEach(e => e.hidden = t === 0); all('.led-rgb').forEach(e => e.hidden = t !== 1); all('.led-gpio').forEach(e => e.hidden = t !== 2);
  $('bri-val').textContent = Math.round($('ledBri').value / 255 * 100) + ' %';
}
for (const [id, kind] of [['ledType','n'],['ledPin','n'],['ledBri','n'],['ledInv','c'],['ledDark','c'],['itv','n'],['stale','n'],['mins','n'],['siri','c']]) {
  $(id).oninput = () => { draft[id] = kind === 'c' ? ($(id).checked ? 1 : 0) : +$(id).value; syncLed(); syncDirty(); };
}
const clone = v => JSON.parse(JSON.stringify(v));
// Speichert nur die genannten Einstellungen (ohne Angabe: alle). Alles andere geht so an den Dongle, wie es
// dort schon steht – ungespeicherte Änderungen in anderen Abschnitten bleiben als Entwurf erhalten.
async function saveConfig(keys) {
  keys = keys || [...PROFILE_KEYS, ...SETTINGS];
  const value = k => keys.includes(k) ? draft[k] : saved[k];
  const body = new URLSearchParams();
  body.set('active', value('active'));
  value('profiles').forEach((p, i) => {  // je Profil ein Feld: der Webserver des Dongles nimmt nur wenige Formularfelder an
    body.set('n' + i, profName(p, i));
    body.set('p' + i, p.map.map(a => `${a.t},${a.t === 1 ? a.m : 0},${a.t ? a.c : 0}`).join(';'));
  });
  for (const k of SETTINGS) body.set(k, value(k));
  try { await post('/api/config', body); } catch (err) { toast(errText(err), true); return false; }
  for (const k of keys) saved[k] = clone(draft[k]);
  syncDirty(); refresh(); toast(t('saved'));
  return true;
}
all('.savebar').forEach(bar => {
  const keys = bar.dataset.keys.split(',');
  bar.querySelector('.save').onclick = () => saveConfig(keys);
  bar.querySelector('.discard').onclick = () => { for (const k of keys) draft[k] = clone(saved[k]); renderConfig(); };
});

// ---- Profile ------------------------------------------------------------------------------------
let builtin = null;
function renderProfile() {
  const sel = $('profile');
  sel.innerHTML = '';
  draft.profiles.forEach((p, i) => sel.add(new Option(profName(p, i) + (i === saved.active ? '  ' + t('profile.activemark') : ''), i)));
  sel.value = draft.active;
  if (document.activeElement !== $('profname')) $('profname').value = cur().name;
  $('prof-note').textContent = t(draft.active === saved.active ? 'profile.active' : 'profile.pending');
}
$('profile').onchange = () => { draft.active = +$('profile').value; renderConfig(); };
$('profname').oninput = () => { cur().name = $('profname').value; renderProfile(); syncDirty(); };
$('profreset').onclick = async () => {
  try { builtin = builtin || await (await fetch('/api/builtin')).json(); } catch (e) { return toast(t('profile.reset.failed'), true); }
  draft.profiles[draft.active] = clone(builtin[draft.active]); renderConfig();
  toast(t('profile.reset.done', {name: cur().name}));
};

// ---- Tasten -------------------------------------------------------------------------------------
function renderKeys() {
  all('.rk').forEach(b => {
    const i = +b.dataset.i, a = cur().map[i];
    b.classList.toggle('sel', i === selected); b.classList.toggle('off', a.t === 0);
    b.title = `${btnName(a.n)}: ${label(a)}`; b.setAttribute('aria-label', b.title);
  });
  $('all').innerHTML = '';
  LIST_COLUMNS.forEach(column => {
    const col = document.createElement('div');
    column.forEach(i => {
      const a = cur().map[i];
      const b = document.createElement('button'); b.type = 'button'; if (i === selected) b.className = 'sel';
      const n = document.createElement('span'); n.textContent = btnName(a.n); const v = document.createElement('span'); v.textContent = label(a);
      b.append(n, v); b.onclick = () => select(i); col.append(b);
    });
    $('all').append(col);
  });
}
function renderEditor() {
  const a = cur().map[selected];
  $('ed-body').hidden = !a;
  if (!a) return;
  $('ed-name').textContent = btnName(a.n); $('ed-now').textContent = t('ed.sends', {what: label(a)});
  all('#ed-type button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.t === a.t));
  $('ed-keyrow').hidden = $('ed-modrow').hidden = a.t !== 1; $('ed-consrow').hidden = a.t !== 2;
  $('ed-ir').hidden = !['Vol+', 'Vol-', 'Mute'].includes(a.n);
  if (a.t === 1) $('ed-key').value = a.c; if (a.t === 2) $('ed-cons').value = a.c;
  all('#ed-mods button').forEach(b => b.setAttribute('aria-pressed', !!(a.m & +b.dataset.m)));
}
function select(i) { if (!draft || i === selected) return; selected = i; renderKeys(); renderEditor(); }
function edit(change) { change(cur().map[selected]); renderKeys(); renderEditor(); syncDirty(); }
function fillUsages() {
  $('ed-key').innerHTML = KEYS.map(([c, n]) => `<option value="${c}">${keyName(n)}</option>`).join('');
  $('ed-cons').innerHTML = CONSUMER.map(([c, n]) => `<option value="${c}">${keyName(n)}</option>`).join('');
}
all('.remote').forEach(r => r.innerHTML = REMOTE);
all('.rk').forEach(b => b.onclick = () => { select(+b.dataset.i); if (b.closest('#tab-start')) showTab('tasten'); });
all('#ed-type button').forEach(b => b.onclick = () => edit(a => {
  a.t = +b.dataset.t; a.m = 0;
  a.c = a.t === 1 ? (KEYS.some(k => k[0] === a.c) ? a.c : KEYS[0][0]) : a.t === 2 ? (CONSUMER.some(k => k[0] === a.c) ? a.c : CONSUMER[0][0]) : 0;
}));
$('ed-key').onchange = () => edit(a => a.c = +$('ed-key').value);
$('ed-cons').onchange = () => edit(a => a.c = +$('ed-cons').value);
all('#ed-mods button').forEach(b => b.onclick = () => edit(a => a.m ^= +b.dataset.m));

// Live: gedrückte Tasten der echten Remote auf den Zeichnungen zeigen (nur solange eine davon sichtbar ist).
let liveSeq = null; const flashUntil = {};
$('follow').checked = store.get('follow', '1') === '1';
$('follow').onchange = () => store.set('follow', $('follow').checked ? '1' : '0');
async function pollLive() {
  if (document.hidden || ($('tab-tasten').hidden && $('tab-start').hidden) || !draft) return;
  let l; try { l = await (await fetch('/api/live')).json(); } catch (e) { return; }
  const now = Date.now();
  if (liveSeq !== null && l.seq !== liveSeq && l.last >= 0) {  // auch sehr kurze Drücke zwischen zwei Abfragen sichtbar machen
    flashUntil[l.last] = now + 350;
    if ($('follow').checked) select(l.last);
  }
  liveSeq = l.seq;
  all('.rk').forEach(b => { const i = +b.dataset.i; b.classList.toggle('hit', !!(l.mask & (1 << i)) || (flashUntil[i] || 0) > now); });
}
setInterval(pollLive, 150);

// ---- Status -------------------------------------------------------------------------------------
function hero(cls, title, sub) { $('beacon').className = 'beacon ' + cls; $('title').textContent = title; $('subtitle').textContent = sub; }
// Zeichnet alles, was vom Zustand des Dongles abhängt. Ohne Zustand (s = null): Dongle nicht erreichbar.
function paintState(s) {
  if (!s) {
    hero('', t(lastState === undefined ? 'loading' : 'hero.unreachable'), lastState === undefined ? '' : t('hero.unreachable.sub'));
    paintLegend(null); return;
  }
  const connected = s.ble === 'connected';
  if (connected) hero('ok', t('hero.connected'), s.lastKey ? t('hero.connected.last', {key: btnName(s.lastKey), age: dur(s.lastKeyAge)}) : t('hero.connected.idle'));
  else if (s.ble === 'connecting') hero('wait', t('hero.connecting'), t('hero.connecting.sub'));
  else if (s.ble === 'searching') hero('wait', t('hero.sleeping'), t('hero.sleeping.sub'));
  else hero('bad', t('hero.unpaired'), t('hero.unpaired.sub'));
  $('version').textContent = t('firmware', {version: s.version});
  $('bond').textContent = s.bond || t('remote.bond.none'); $('link').textContent = connected ? t('remote.link.interval', {ms: s.interval}) : t('remote.link.down');
  $('rssi').textContent = connected ? `${s.rssi} dBm` : '–';
  const low = s.batt !== undefined && s.batt <= 15 && s.power !== 0xAB && s.power !== 0xBB;
  const battNote = s.power === 0xAB ? 'remote.battery.charging' : s.power === 0xBB ? 'remote.battery.plugged' : low ? 'remote.battery.low' : '';
  $('batt').textContent = s.batt === undefined ? '–' : `${s.batt} %` + (battNote ? ' · ' + t(battNote) : '');
  $('batt').style.color = low ? 'var(--bad)' : '';
  if (connected && low) $('subtitle').textContent = t('hero.battery', {pct: s.batt});
  $('key').textContent = s.lastKey ? t('remote.lastkey.age', {key: btnName(s.lastKey), age: dur(s.lastKeyAge)}) : '–';
  const activeProfile = s.cfg.profiles[s.cfg.active]; $('profile-view').textContent = profName(activeProfile, s.cfg.active);
  const lastAction = s.lastKey && activeProfile.map.find(a => a.n === s.lastKey); $('keysends').textContent = lastAction ? label(lastAction) : '–';
  $('fwver').textContent = s.version; $('uptime').textContent = dur(s.uptime);
  $('wifi').textContent = s.wifiMode === 'ap' ? t('dongle.wifi.ap', {ssid: s.ssid}) : s.wifiMode === 'sta' ? s.ssid : t('dongle.wifi.joining');
  $('ip').textContent = s.ip; $('left').textContent = s.cfg.mins === 0 && s.wifiMode !== 'ap' ? t('dongle.left.always') : t('dongle.left.in', {time: dur(s.setupLeft)});
  $('apnote').hidden = s.wifiMode !== 'ap'; $('unpair').disabled = !s.bond;
  paintLegend(s.cfg);
}
// Texte der Übersicht, die von den Einstellungen abhängen (LED-Art, „aus solange verbunden“, Siri-Taste).
function paintLegend(cfg) {
  const rgb = !cfg || cfg.ledType === 1, color = c => rgb ? t('led.color.' + c) : '';
  $('legend-box').hidden = !!cfg && cfg.ledType === 0;
  $('led-solid').innerHTML = t('led.solid', {dark: cfg && cfg.ledDark ? t('led.solid.dark') : ''});
  for (const [id, c] of [['slow', 'violet'], ['white', 'white'], ['yellow', 'yellow']]) $('led-' + id).innerHTML = t('led.' + id, {[c]: color(c)});
  $('dongle-hint').textContent = t('dongle.hint', {siri: cfg && cfg.siri ? t('dongle.hint.siri') : ''});
}
async function refresh() {
  let s = null;
  try { s = await (await fetch('/api/state')).json(); } catch (e) {}
  lastState = s; paintState(s);
  if (!s) return;
  if (!saved) { loadConfig(s.cfg); savedSsid = s.savedSsid || ''; fillNetworks([]); fillNet(s.net); }
  if (s.wifiMode === 'ap' && !scannedOnce) { scannedOnce = true; scan(); }
}

confirmed($('unpair'), async () => { await post('/api/unpair'); toast(t('done.unpaired')); refresh(); });
confirmed($('setupoff'), async () => { await post('/api/setup-off'); toast(t('done.wifioff')); });
confirmed($('reboot'), async () => { await post('/api/reboot'); toast(t('done.reboot')); });
confirmed($('defaults'), async () => { await post('/api/defaults'); saved = null; await refresh(); toast(t('reset.settings.done')); });
confirmed($('factory'), async () => { await post('/api/factory-reset'); toast(t('reset.factory.done')); });
confirmed($('wififorget'), async () => {
  await post('/api/wifi', new URLSearchParams({ssid:'', pass:''})); savedSsid = ''; fillNetworks([]); fillNet();
  toast(t('reset.wifi.done'));
});

// ---- WLAN ---------------------------------------------------------------------------------------
const bars = rssi => '▂▄▆█'.slice(0, rssi >= -55 ? 4 : rssi >= -67 ? 3 : rssi >= -78 ? 2 : 1);
function fillNetworks(nets) {
  lastNets = nets;
  const sel = $('netsel'), keep = sel.value || savedSsid;
  sel.innerHTML = '';
  if (!nets.length && !savedSsid) sel.add(new Option(t('wifi.pick'), ''));
  if (savedSsid && !nets.some(n => n.ssid === savedSsid)) sel.add(new Option(t('wifi.saved.option', {ssid: savedSsid}), savedSsid));
  for (const n of nets) sel.add(new Option(`${n.ssid}   ${bars(n.rssi)} ${n.rssi} dBm${n.open ? ' · ' + t('wifi.open') : ''}${n.ssid === savedSsid ? ' · ' + t('wifi.saved') : ''}`, n.ssid));
  sel.add(new Option(t('wifi.other'), OTHER));
  sel.value = [...sel.options].some(o => o.value === keep) ? keep : sel.options[0].value;
  pickNetwork();
}
function pickNetwork() {
  const v = $('netsel').value;
  $('ssidrow').hidden = v !== OTHER;
  if (v !== OTHER) $('wifiform').ssid.value = v;
}
$('netsel').onchange = () => { pickNetwork(); const f = $('wifiform'); ($('netsel').value === OTHER ? f.ssid : f.pass).focus(); };
async function scan() {
  $('scan').disabled = true; $('msg-scan').textContent = t('wifi.scan.running');
  try {
    const nets = (await (await fetch('/api/scan')).json()).sort((a, b) => b.rssi - a.rssi);
    fillNetworks(nets);
    $('msg-scan').textContent = nets.length ? t('wifi.scan.found', {n: nets.length}) : t('wifi.scan.none');
  } catch (err) { $('msg-scan').textContent = t('wifi.scan.failed'); }
  $('scan').disabled = false;
}
$('scan').onclick = scan;
function hidePassword() { $('wifiform').pass.type = 'password'; $('eye').setAttribute('aria-pressed', false); $('eye').style.opacity = .6; }
$('eye').onclick = () => {
  const input = $('wifiform').pass, show = input.type === 'password';
  input.type = show ? 'text' : 'password'; $('eye').setAttribute('aria-pressed', show); $('eye').style.opacity = show ? 1 : .6;
};
hidePassword();
const IPV4 = /^(25[0-5]|2[0-4]\d|1?\d?\d)(\.(25[0-5]|2[0-4]\d|1?\d?\d)){3}$/;
function syncNet() { all('.manual').forEach(e => e.hidden = $('dhcp').value !== '0'); }
function paintPassword() { $('wifiform').pass.placeholder = savedSsid ? t('wifi.password.keep') : ''; }
function fillNet(net) {
  const f = $('wifiform'); net = net || {dhcp:true};
  $('dhcp').value = net.dhcp ? '1' : '0';
  for (const k of ['ip','mask','gw','dns']) f[k].value = net[k] || '';
  paintPassword(); syncNet();
}
$('dhcp').onchange = syncNet;
$('wifiform').onsubmit = async e => {
  e.preventDefault(); const f = e.target; hidePassword();
  if (!f.ssid.value) return toast(t('wifi.need'), true);
  const body = new URLSearchParams({ssid:f.ssid.value, pass:f.pass.value, dhcp:$('dhcp').value});
  // Leeres Passwortfeld beim schon gespeicherten Netz heißt: Passwort behalten (z. B. nur die Adresse ändern).
  if (!f.pass.value && f.ssid.value === savedSsid) body.set('keep', '1');
  if ($('dhcp').value === '0') {
    if (!IPV4.test(f.ip.value) || !IPV4.test(f.mask.value)) return toast(t('wifi.badip'), true);
    for (const k of ['gw','dns']) if (f[k].value && !IPV4.test(f[k].value)) return toast(t('wifi.badgw'), true);
    for (const k of ['ip','mask','gw','dns']) body.set(k, f[k].value);
  }
  try {
    await post('/api/wifi', body); savedSsid = f.ssid.value; f.pass.value = ''; paintPassword();
    toast($('dhcp').value === '0' ? t('wifi.done.static', {ip: f.ip.value}) : t('wifi.done.dhcp'));
  } catch (err) { toast(errText(err), true); }
};

// ---- Sicherung ----------------------------------------------------------------------------------
$('export').onclick = () => {
  if (!saved) return;
  const data = JSON.stringify({type:'siri-bridge-config', version:2, firmware:$('fwver').textContent, saved:new Date().toISOString(), cfg:saved}, null, 2);
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], {type:'application/json'}));
  a.download = `siri-bridge-config-${new Date().toISOString().slice(0, 10)}.json`; a.click(); URL.revokeObjectURL(a.href);
};
// Der Speichern-Knopf der Sicherung ist nur aktiv, solange eine geladene Datei auf das Übernehmen wartet.
let loadedName = '';
function note(id, text, cls) { const el = $(id); el.textContent = text; el.className = 'loaded' + (cls ? ' ' + cls : ''); el.hidden = !text; }
$('importsave').onclick = async () => {
  if (await saveConfig()) { $('importsave').disabled = true; note('loaded', t('backup.stored', {file: loadedName}), 'ok'); }
};
$('importbtn').onclick = () => $('import').click();
$('import').onchange = async e => {
  const file = e.target.files[0].name;
  try {
    const j = JSON.parse(await e.target.files[0].text()), c = j.cfg;
    if (j.type !== 'siri-bridge-config' || !c) throw new Error('format');
    const count = cur().map.length, copyMap = (to, from) => to.forEach((a, i) => { a.t = +from[i].t || 0; a.m = +from[i].m || 0; a.c = +from[i].c || 0; });
    if (Array.isArray(c.profiles)) {  // Format ab v0.4: alle Profile
      if (c.profiles.length !== draft.profiles.length || c.profiles.some(p => !Array.isArray(p.map) || p.map.length !== count)) throw new Error('format');
      c.profiles.forEach((p, i) => { draft.profiles[i].name = String(p.name || '').slice(0, 23); copyMap(draft.profiles[i].map, p.map); });
      draft.active = Math.min(Math.max(+c.active || 0, 0), draft.profiles.length - 1);
    } else if (Array.isArray(c.map) && c.map.length === count) {  // altes Format: eine Belegung, kommt ins gewählte Profil
      copyMap(cur().map, c.map);
    } else throw new Error('format');
    for (const k of SETTINGS) if (k in c) draft[k] = +c[k] || 0;
    renderConfig();
    loadedName = file;
    note('loaded', t(dirty() ? 'backup.loaded.dirty' : 'backup.loaded.same', {file}));
    $('importsave').disabled = false;
    toast(t('backup.loaded.toast'));
  } catch (err) { $('importsave').disabled = true; note('loaded', t('backup.invalid', {file}), 'err'); toast(t('backup.invalid.toast'), true); }
  e.target.value = '';
};

// ---- Firmware-Update ----------------------------------------------------------------------------
const sleep = ms => new Promise(r => setTimeout(r, ms));
// Wartet nach einem Update, bis der Dongle wieder antwortet, und meldet das Ergebnis in der Karte.
async function awaitReboot(before) {
  await sleep(4000);
  for (const end = Date.now() + 60000; Date.now() < end; await sleep(1500)) {
    let s; try { s = await (await fetch('/api/state', {cache:'no-store'})).json(); } catch (e) { continue; }
    if (s.uptime > 90) continue;  // noch die alte Sitzung
    if (s.version !== before) { note('fwstatus', t('fw.ok', {before, after: s.version}), 'ok'); toast(t('fw.ok.short')); }
    else note('fwstatus', t('fw.same', {version: s.version}));
    return;
  }
  note('fwstatus', t('fw.silent'), 'err');
}
// Eigener Knopf statt des Dateifelds des Browsers: Dessen Beschriftung folgt der Browsersprache, nicht der Seite.
function paintFile() { const f = $('fw').files[0]; $('fwname').textContent = f ? f.name : t('fw.nofile.label'); }
$('fwpick').onclick = () => $('fw').click();
$('fw').onchange = paintFile;
$('fwgo').onclick = () => {
  const file = $('fw').files[0];
  if (!file) return toast(t('fw.nofile'), true);
  if (/merged/.test(file.name)) return toast(t('fw.merged'), true);
  const xhr = new XMLHttpRequest(), data = new FormData(); data.append('firmware', file);
  $('fwprog').hidden = false; $('fwgo').disabled = true;
  xhr.upload.onprogress = e => { if (e.lengthComputable) $('fwprog').value = e.loaded / e.total * 100; };
  const done = () => { $('fwgo').disabled = false; $('fwprog').hidden = true; };
  const before = $('fwver').textContent;
  note('fwstatus', t('fw.sending'));
  xhr.onload = () => {
    done();
    if (xhr.status !== 200) { note('fwstatus', t('fw.failed', {msg: xhr.responseText}), 'err'); return toast(t('fw.failed.short'), true); }
    note('fwstatus', t('fw.sent'));
    toast(t('fw.rebooting')); awaitReboot(before);
  };
  xhr.onerror = () => { done(); note('fwstatus', t('fw.aborted'), 'err'); toast(t('fw.aborted.short'), true); };
  xhr.open('POST', '/api/ota'); xhr.send(data);
};

// ---- Sprache anwenden ---------------------------------------------------------------------------
// Setzt alle festen Texte (data-i18n = Text, data-i18n-html = Text mit Auszeichnung, data-i18n-title = Tooltip)
// und zeichnet neu, was sonst noch Text enthält.
function applyLang() {
  document.documentElement.lang = lang;
  all('[data-i18n]').forEach(e => { if (!e.classList.contains('armed')) e.textContent = t(e.dataset.i18n); });
  all('[data-i18n-html]').forEach(e => e.innerHTML = t(e.dataset.i18nHtml));
  all('[data-i18n-title]').forEach(e => { e.title = t(e.dataset.i18nTitle); e.setAttribute('aria-label', e.title); });
  all('#langs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  fillUsages(); paintFile();
  if (draft) { renderConfig(); fillNetworks(lastNets); paintPassword(); }
  $('msg-scan').textContent = '';
  paintState(lastState || null);
}
for (const code of Object.keys(LANGS)) {
  const b = document.createElement('button'); b.type = 'button'; b.dataset.lang = code; b.textContent = code.toUpperCase(); b.title = LANGS[code]['lang.name'] || code;
  b.onclick = () => { lang = code; store.set('lang', code); applyLang(); };
  $('langs').append(b);
}
lastState = undefined;  // noch nie abgefragt: „Lädt …“ statt „nicht erreichbar“
applyLang();

showTab(location.hash.slice(1)); refresh(); setInterval(refresh, 2000);
</script>
</body>
</html>
